name: Fuzz

# Runs every cargo-fuzz target in crates/*/fuzz (docs/standards/rust.md § Tests): nightly for long,
# building on the corpus earlier runs kept, and briefly on a pull request that changes the Rust, so
# a broken target or a decoder it breaks is seen before it merges. Nightly, it also runs the
# property tests on random seeds: everywhere else they run on fixed ones.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # libFuzzer's instrumentation needs nightly; this job alone uses it, pinned to one date.
  NIGHTLY: nightly-2026-11-01
  SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || '600' }}
  # What a target's build takes inside its time cap: the slowest one measured on CI took 37 s.
  BUILD_MINUTES: 2

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # scripts/capped.ts caps each target's memory and time, and needs only Node's built-ins.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo "+$NIGHTLY" install --locked cargo-fuzz@0.13.2
      # Each run starts from the corpus the last one left, so the nightly runs add up.
      - uses: actions/cache@v6
        with:
          path: crates/*/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run every target
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in crates/*/fuzz/Cargo.toml; do
            crate=$(dirname "$(dirname "$manifest")")
            # Listed first, so a crate whose targets can't be listed fails the job.
            targets=$(cd "$crate" && cargo "+$NIGHTLY" fuzz list)
            if [ -z "$targets" ]; then
              echo "$crate/fuzz has no targets" >&2
              exit 1
            fi
            for target in $targets; do
              echo "::group::$crate $target"
              mkdir -p "$crate/fuzz/corpus/$target" "$crate/fuzz/seeds/$target"
              # libFuzzer's own limits are given, not left to its defaults, inside a cap of the run's.
              (cd "$crate" && node ../../scripts/capped.ts --memory 4G \
                --time "$((SECONDS_PER_TARGET / 60 + BUILD_MINUTES + 5))m" -- \
                cargo "+$NIGHTLY" fuzz run "$target" \
                "fuzz/corpus/$target" "fuzz/seeds/$target" \
                -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048)
              echo "::endgroup::"
            done
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/

  # A pull request runs every property test on one fixed seed (`cargo xtask gate` and
  # tests/support/fast-check-seed.ts), so it fails only for what it changed. This job draws new
  # cases: round after round, each on random seeds it prints, while a whole round still fits.
  properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # This job never commits, so it installs no git hooks.
      HUSKY: 0
      STEP_MINUTES: 105
      # The most a round can take: test:rust's 30-minute cap, test's 10, and a margin. No round
      # starts with less than this left, so none is cut off.
      ROUND_MINUTES: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152
      - run: pnpm install --frozen-lockfile
      - name: Run the property tests on random seeds
        timeout-minutes: 105
        run: |
          set -euo pipefail
          round=0
          while [ $((STEP_MINUTES * 60 - SECONDS)) -ge $((ROUND_MINUTES * 60)) ]; do
            round=$((round + 1))
            proptest_seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            fc_seed=$(od -An -N4 -td4 /dev/urandom | tr -d ' ')
            # Noted before the round runs, so that a run cancelled mid-round still names it.
            echo "- Round $round at $GITHUB_SHA: PROPTEST_RNG_SEED=$proptest_seed FC_SEED=$fc_seed" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Round $round: PROPTEST_RNG_SEED=$proptest_seed FC_SEED=$fc_seed"
            replay=""
            if ! PROPTEST_RNG_SEED="$proptest_seed" pnpm test:rust; then
              replay="PROPTEST_RNG_SEED=$proptest_seed pnpm test:rust"
            elif ! FC_SEED="$fc_seed" pnpm test; then
              replay="FC_SEED=$fc_seed pnpm test"
            fi
            echo "::endgroup::"
            if [ -n "$replay" ]; then
              message="Round $round failed at $GITHUB_SHA. Replay it there with: $replay"
              echo "::error::$message"
              printf '\n**%s**\n' "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "$round rounds passed." >> "$GITHUB_STEP_SUMMARY"
      # A failed proptest writes its shrunk case's seed here; committed with the fix, every run
      # after replays it.
      - name: Keep what failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore
