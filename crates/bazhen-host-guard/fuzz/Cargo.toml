# The host guard's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own,
# built only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-host-guard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-host-guard = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "containment"
path = "fuzz_targets/containment.rs"
test = false
doc = false
bench = false

[workspace]
