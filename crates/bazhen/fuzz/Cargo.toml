# The CLI's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own, built
# only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "reply"
path = "fuzz_targets/reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attach"
path = "fuzz_targets/attach.rs"
test = false
doc = false
bench = false

[workspace]
