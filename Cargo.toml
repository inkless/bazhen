[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Every third-party crate is pinned here, exactly, and members take it with `{ workspace = true }`
# (docs/standards/rust.md § Dependencies).
[workspace.dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Fires on nearly every pure function. `#[must_use]` goes where ignoring the value is a bug.
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
