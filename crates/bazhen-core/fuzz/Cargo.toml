# The core's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own, built
# only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-core = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "parse_role"
path = "fuzz_targets/parse_role.rs"
test = false
doc = false
bench = false

[workspace]
