name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never commits, so it installs no git hooks.
  HUSKY: 0

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the real-tmux suites refuse any host but a marked Linux one, so on macOS they
        # need a Linux container or a change to tests/support/disposable-host.ts. The Rust crates
        # run in `rust-linux` and `rust-macos`.
        os: [ubuntu-latest]
        # "pinned" is the version in .nvmrc, so a bump never renames the check.
        node: ["24", "pinned"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The standards check holds the migrations that were on the target branch at the merge base.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node != 'pinned' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'pinned' && '.nvmrc' || '' }}
          cache: pnpm
      # No tmux or shells: check-ts runs no suite that starts them. The marker stays: the medium
      # tests of falsify-base and falsify that run only on a sandbox run here and nowhere else.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # check-ts runs rustfmt on the crates (crates/), and builds the binaries the medium tests run,
      # on the toolchain rust-toolchain.toml pins.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
        id: install
      # `make check` in its halves (CHECK_HALVES in scripts/check-standards.ts), less test-rust:
      # check-ts here, and check-rust in `rust-linux`, beside this job, which runs test-rust-all in
      # test-rust's place, the same nextest run and the tests ignored as signalling too. The Rust
      # gates don't depend on the Node version, and the holder suite runs there on the pinned Node
      # alone; node 24, which goes at the Rust daemon's cutover, runs the TypeScript half.
      - run: make check-ts
      # shellcheck is on the runner image, not on every developer's machine, so it runs here.
      # It runs after an earlier gate has failed, so one red gate doesn't hide what the others
      # find, but not after a setup step has, which would only add red steps that aren't test failures.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make lint-shell

  # The Rust gates, the holder suite and the Rust tests, on Linux and on macOS, where code behind
  # `cfg(target_os = "macos")` is built and tested. Each OS's work is spread over legs side by side,
  # so none waits on another: the gates and the holder suite in one, and test-rust-all in two
  # halves (`--partition`, crates/bazhen-xtask/src/gate.rs), which between them run each test once.
  # Each leg builds what it runs afresh. `rust (linux)` and `rust (macos)` below pass only when
  # every leg of their OS did, so the legs can change without the checks' names changing.
  # macOS runs clippy alone of the gates: tmux isn't run there, and rustfmt, cargo-deny and the
  # Rust schema don't depend on the OS (deny.toml checks every target triple), so Linux covers them.
  # Like `check`, they run on every pull request, so a change to a crate, Cargo.*,
  # rust-toolchain.toml or a gate script is always covered. No pnpm cache is saved on macOS: the
  # cache is large enough to push the repo's other caches out.
  rust-linux:
    name: rust (linux, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each leg installs the one tool it runs: cargo-deny for check-rust, nextest for the tests.
        include:
          - leg: gates
            tool: cargo-deny@0.20.2
          - leg: tests 1/2
            partition: 1/2
            tool: cargo-nextest@0.9.152
          - leg: tests 2/2
            partition: 2/2
            tool: cargo-nextest@0.9.152
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/apt-update
      # The real-shell tests run zsh, bash and fish.
      - name: Install the shells the real-shell tests run
        run: sudo apt-get install -y tmux fish zsh
      # The suites that signal processes they didn't start, which run only on a sandbox: this
      # runner, marked disposable here, or the test container. `make check` leaves them out.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # A leg with no tool would hand install-action an empty list, which it takes as nothing to do.
      - name: Check the leg names its tool
        env:
          TOOL: ${{ matrix.tool }}
        run: test -n "$TOOL" || { echo "::error::this leg's matrix entry names no tool"; exit 1; }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: ${{ matrix.tool }}
      - run: pnpm install --frozen-lockfile
        id: install
      # check's Rust gates: clippy, cargo-deny and the Rust schema. rustfmt runs in `check`.
      - if: matrix.leg == 'gates'
        run: make check-rust
      # Each runs after an earlier gate has failed, so one red gate doesn't hide what the others
      # find, but not after a setup step has, which would only add red steps that aren't test failures.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.leg == 'gates' }}
        run: make test-holder
      - if: matrix.partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: make test-rust-all ARGS="--partition $PARTITION"

  rust-macos:
    name: rust (macos, ${{ matrix.leg }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: gates
          - leg: tests 1/2
            partition: 1/2
          - leg: tests 2/2
            partition: 2/2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - if: matrix.partition
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152
      # The suites that signal processes they didn't start run only on a host carrying the marker,
      # and these runners are the only macOS places they run.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # The real-shell tests run zsh, bash and fish, and the integration takes bash 4.4 or later:
      # macOS has zsh, and bash 3.2 alone.
      - name: Install the shells the real-shell tests run
        run: brew install bash fish
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: pnpm install --frozen-lockfile
        id: install
      - if: matrix.leg == 'gates'
        run: make lint-rust
      # It runs after the gate has failed, so one red gate doesn't hide what the other finds, but
      # not after a setup step has, which would only add red steps that aren't test failures.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.leg == 'gates' }}
        run: make test-holder
      - if: matrix.partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: make test-rust-all ARGS="--partition $PARTITION"

  # The checks that stand for each OS's legs. Each runs whatever became of them, because a skipped
  # check counts as passed, and passes only when every leg succeeded: a failed, timed-out or
  # cancelled leg fails it.
  rust-linux-passed:
    name: rust (linux)
    needs: rust-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.rust-linux.result }}
        run: |
          echo "rust (linux, gates), (linux, tests 1/2) and (linux, tests 2/2): $RESULT"
          test "$RESULT" = success

  rust-macos-passed:
    name: rust (macos)
    needs: rust-macos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.rust-macos.result }}
        run: |
          echo "rust (macos, gates), (macos, tests 1/2) and (macos, tests 2/2): $RESULT"
          test "$RESULT" = success

  # The black-box suite runs the real harness CLIs, pinned in tests/api. No agent is let reach a
  # model, so it needs no credentials. It is slower than `make check`, so it is a job of its own.
  # The tmux runtime's own suite, against a private real tmux, runs here too, before it: it takes
  # under a minute on the same setup, so a job of its own would spend a runner on setup alone.
  # tmux is an opt-in runtime, but its suite fails these required checks like the api suite does.
  api:
    name: api (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The api suite's 20 minutes, and the 20 the Makefile caps the integration suite at.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux only, as in `check`: the real-tmux suites refuse any host but a marked Linux one.
        # 24.04's fish (3.7) is one the shell integration types a restarted shell's line back into,
        # and the latest image's isn't, so between them the api suite covers both. 24.04's system
        # tmux is 3.4, before the crash fix the README names, so the integration suite checks its
        # defects there; the latest image's tmux is newer.
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/apt-update
        if: runner.os == 'Linux'
      - name: Install tmux, and the shells the suites start in it
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux fish zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
        id: install
      - name: The integration suite (tmux)
        run: make test-integration
      # It runs after the integration suite has failed, so one red suite doesn't hide what the
      # other finds, but not after a setup step has, which would only add red steps that aren't
      # test failures.
      - name: The api suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test-api

  # The api test files tests/rust-daemon.txt lists, against the Rust daemon, which is to replace the
  # TypeScript one: each passes on both, running every test it has. It also fails when the list lost
  # a line against the base's, so a file leaves only at the cutover, with this job and the selector.
  # On a pull request the base is HEAD^1, the base branch the merge commit was made on, fixed for a
  # rerun. On a push to main it is what main was before the push, so a force-push or a push of
  # several commits is held to that. There is no merge queue: pull requests are squash-merged and
  # must be up to date with main first, so main before a merge is the base it was checked against.
  api-rust-daemon:
    name: api (rust daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/apt-update
      - name: Install tmux
        run: sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Fetch what main was before the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --depth=1 origin "$BEFORE"
      - name: Run the listed files against the Rust daemon
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: make test-api-rust ARGS="--base $BASE"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/apt-update
      - name: Install tmux, and what the shell suite runs in a shell
        run: |
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo apt-get install -y tmux fish zsh
          sudo apt-get install -y --no-install-recommends neovim less man-db htop
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bazhen/e2e-tests exec playwright install --with-deps chromium
      # Under the job's 20 minutes, so the upload below still gets its turn when a run hangs.
      - run: make test-e2e
        timeout-minutes: 17
      # The report and traces of a run that failed or hit its time limit; always(), since a hang
      # is what they are for. Anyone can download them: they hold only the run's throwaway
      # daemons' device cookie and pairing codes, and screens of synthetic sessions, and no
      # secret reaches this job's tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The branch's falsify, and the base's for a branch that changes falsify (scripts/falsify-base.ts),
  # each on a runner of its own: one triggered base run does the head's work over again, and the two
  # in series outgrew one job's budget. The base half always runs and decides in its script whether
  # it is needed, so the gate never sees a half that was skipped.
  falsify-half:
    name: falsify (${{ matrix.half }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Falsify bounds itself: the Makefile runs each half, the base half's install of the base
    # included, under `capped --time 120m`, which stops it with a message saying so. This is that
    # 120 plus about a minute of setup before the step and a margin, so capped's stop always comes
    # first and the log says why. The two must change together.
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - half: head
            task: test-falsify
          - half: base
            task: test-falsify-base
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch, and every commit message on the branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/apt-update
      - name: Install tmux
        run: sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # Falsify lists the Rust tests with nextest, at the base and at HEAD, to find the new ones,
      # and runs them against the mutants cargo-mutants lists in the code the branch changed.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.152,cargo-mutants@27.1.0
      - run: pnpm install --frozen-lockfile
      # The base ref names a branch of this repository, which only its writers make: ARGS's shell
      # reads it as it reads any word.
      - name: make ${{ matrix.task }}
        env:
          BASE_REF: ${{ github.base_ref }}
          TASK: ${{ matrix.task }}
        run: make "$TASK" ARGS="--base origin/$BASE_REF"

  # The check branch protection requires. It runs whatever became of the halves, because a skipped
  # required check counts as passed, and passes only when both succeeded: a failed, timed-out or
  # cancelled half fails it.
  falsify:
    needs: falsify-half
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          RESULT: ${{ needs.falsify-half.result }}
        run: |
          echo "falsify (head) and falsify (base): $RESULT"
          test "$RESULT" = success
