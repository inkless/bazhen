# The dependency policy: docs/standards/rust.md § Dependencies.

[graph]
all-features = true
# The triples Bazhen is built for: alacritty_terminal's windows-sys is never built, and would
# otherwise count as a second version of the one rustix takes.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
# Add a licence only when a crate needs it, saying which in the commit.
# Unicode-3.0: unicode-ident, which serde_derive and thiserror-impl build on.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
# Test-only crates too: the policy is one list, whatever ships.
include-dev = true
# Our own crates are never published, so they carry no licence.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Our own crates depend on each other by path, which cargo-deny reads as a wildcard.
allow-wildcard-paths = true
# Crates that signal any pid through a method (`Process::kill`), which the chokepoint scan can't
# tell from a child's own kill: docs/standards/rust.md § Signals.
deny = [
  { crate = "sysinfo", reason = "Process::kill signals any pid; signal through a chokepoint" },
  { crate = "psutil", reason = "Process::kill signals any pid; signal through a chokepoint" },
  { crate = "heim", reason = "Process::kill signals any pid; signal through a chokepoint" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
