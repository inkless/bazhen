# The holder's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own,
# built only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-holder-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-holder = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "proc_stat"
path = "fuzz_targets/proc_stat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_args"
path = "fuzz_targets/proc_args.rs"
test = false
doc = false
bench = false

[workspace]
