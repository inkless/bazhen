packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# node-pty loads its shipped prebuilds for darwin and linux (x64, arm64); its install script
# would only fall back to a native compile. Revisit when Windows support needs ConPTY.
allowBuilds:
  node-pty: false
  # Links the pinned platform binary; tests/api runs the real CLI against a fake model API.
  "@anthropic-ai/claude-code": true
