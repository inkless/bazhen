name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never commits, so it installs no git hooks.
  HUSKY: 0

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are billed at a premium while the repo is private; add macos-latest back
        # once it is public. The real-tmux suites refuse any host but a marked Linux one, so on
        # macOS they need a Linux container or a change to tests/support/disposable-host.ts.
        os: [ubuntu-latest]
        node: ["24", "26.13.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      # The real-tmux suites refuse to run on any host that is not thrown away after use.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # The hook client (apps/hook) is Rust; tests build and run it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration

  # The black-box suite runs the real harness CLIs, pinned in tests/api. No agent is let reach a
  # model, so it needs no credentials. It is slower than `pnpm check`, so it is a job of its own.
  api:
    name: api (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are billed at a premium while the repo is private; add macos-latest back
        # once it is public. The real-tmux suites refuse any host but a marked Linux one, so on
        # macOS they need a Linux container or a change to tests/support/disposable-host.ts.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bazhen/e2e-tests exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  falsify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch, and every commit message on the branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:falsify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm test:falsify --base "origin/$BASE_REF"
