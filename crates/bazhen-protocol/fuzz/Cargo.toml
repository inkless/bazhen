# The protocol's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own,
# built only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-protocol = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "detach_keys"
path = "fuzz_targets/detach_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[workspace]
