[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Every third-party crate is pinned here, exactly, and members take it with `{ workspace = true }`
# (docs/standards/rust.md § Dependencies).
[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
missing_debug_implementations = "forbid"
unreachable_pub = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Fires on nearly every pure function. `#[must_use]` goes where ignoring the value is a bug.
must_use_candidate = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
unreachable = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
