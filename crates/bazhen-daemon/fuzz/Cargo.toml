# The daemon's fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its own, built
# only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-daemon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-daemon = { path = ".." }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.154"

[[bin]]
name = "agent_launch"
path = "fuzz_targets/agent_launch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_frame"
path = "fuzz_targets/rpc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_frame"
path = "fuzz_targets/stream_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tasks"
path = "fuzz_targets/tasks.rs"
test = false
doc = false
bench = false

[workspace]
