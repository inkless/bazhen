# The browser suite, run in this folder, where playwright.config.ts is.

[tasks.test-e2e]
command = "node ../../scripts/capped.ts --memory 10G --time 30m -- node_modules/.bin/playwright test"
deps = ["root:build-hook", "root:build-holder-release"]
# Streamed, so a hung run's log names the test it stopped in; moon prints a buffered task's output
# only once the task has ended.
options = { cache = false, runDepsInParallel = false, outputStyle = "stream" }
