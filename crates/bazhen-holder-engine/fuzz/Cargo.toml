# The engine's fuzz target. libFuzzer needs nightly, so this crate is a workspace of its own, built
# only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-holder-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-holder-engine = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "advance"
path = "fuzz_targets/advance.rs"
test = false
doc = false
bench = false

[workspace]
