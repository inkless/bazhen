# The harness adapters' fuzz targets. libFuzzer needs nightly, so this crate is a workspace of its
# own, built only by `cargo +nightly fuzz` (.github/workflows/fuzz.yml).
[package]
name = "bazhen-harness-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bazhen-harness = { path = ".." }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.154"

[[bin]]
name = "ingest"
path = "fuzz_targets/ingest.rs"
test = false
doc = false
bench = false

[workspace]
