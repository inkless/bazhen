name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI never commits, so it installs no git hooks.
  HUSKY: 0

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the real-tmux suites refuse any host but a marked Linux one, so on macOS they
        # need a Linux container or a change to tests/support/disposable-host.ts. The Rust crates
        # run on macOS in `rust-macos`.
        os: [ubuntu-latest]
        # "pinned" is the version in .nvmrc, so a bump never renames the check.
        node: ["24", "pinned"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The standards check holds the migrations that were on the target branch at the merge base.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node != 'pinned' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'pinned' && '.nvmrc' || '' }}
          cache: pnpm
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      # The real-tmux suites refuse to run on any host that is not thrown away after use.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # The Rust crates (crates/) build on the toolchain rust-toolchain.toml pins; `pnpm check` runs
      # rustfmt, clippy, cargo-deny and nextest on them.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # shellcheck is on the runner image, not on every developer's machine, so it runs here.
      - run: pnpm lint:shell
      # The suites that signal processes they didn't start, which run only on a sandbox: this
      # runner, marked disposable above, or the test container. `pnpm check` leaves them out.
      - run: pnpm test:holder
      - run: pnpm test:rust:all

  # The Rust gates on macOS, where code behind `cfg(target_os = "macos")` is built and tested.
  # Only clippy and nextest: tmux isn't run here, and rustfmt and cargo-deny don't depend on the
  # OS (deny.toml checks every target triple), so `check` covers them. Like `check`, it runs on
  # every pull request, so a change to a crate, Cargo.*, rust-toolchain.toml or a gate script is
  # always covered. No pnpm cache is saved: the cache is large enough to push the repo's other
  # caches out.
  rust-macos:
    name: rust (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152
      # The suites that signal processes they didn't start run only on a host carrying the marker,
      # and this runner is the only macOS place they run.
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:rust
      - run: pnpm test:rust:all
      - run: pnpm test:holder

  # The black-box suite runs the real harness CLIs, pinned in tests/api. No agent is let reach a
  # model, so it needs no credentials. It is slower than `pnpm check`, so it is a job of its own.
  api:
    name: api (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux only, as in `check`: the real-tmux suites refuse any host but a marked Linux one.
        # 24.04's fish (3.7) is one the shell integration types a restarted shell's line back into,
        # and the latest image's isn't, so between them the suite covers both.
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Install tmux
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api

  # The api test files tests/rust-daemon.txt lists, against the Rust daemon, which is to replace the
  # TypeScript one: each passes on both, running every test it has. It also fails when the list lost
  # a line against the base's, so a file leaves only at the cutover, with this job and the selector.
  # On a pull request the base is HEAD^1, the base branch the merge commit was made on, fixed for a
  # rerun. On a push to main it is what main was before the push, so a force-push or a push of
  # several commits is held to that. There is no merge queue: pull requests are squash-merged and
  # must be up to date with main first, so main before a merge is the base it was checked against.
  api-rust-daemon:
    name: api (rust daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Fetch what main was before the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --depth=1 origin "$BEFORE"
      - name: Run the listed files against the Rust daemon
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: pnpm test:api:rust --base "$BASE"

  # The tmux runtime's own suite, against a private real tmux. tmux is an opt-in runtime, so this
  # job runs on every pull request but isn't a required check.
  integration-tmux:
    name: integration (tmux, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24.04's system tmux is 3.4, before the crash fix the README names, so the suite checks
        # its defects there; the latest image's tmux is newer.
        os: [ubuntu-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install tmux, and the shells the suite starts in it
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install tmux, and what the shell suite runs in a shell
        run: |
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y tmux fish zsh
          sudo apt-get install -y --no-install-recommends neovim less man-db htop
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bazhen/e2e-tests exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  falsify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch, and every commit message on the branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux fish zsh
      - name: Mark the runner disposable
        run: sudo touch /etc/bazhen-disposable-host
      # Falsify lists the Rust tests with nextest, at the base and at HEAD, to find the new ones,
      # and runs them against the mutants cargo-mutants lists in the code the branch changed.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152,cargo-mutants@27.1.0
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:falsify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm test:falsify --base "origin/$BASE_REF"
      # A branch that changes falsify is judged by the base's falsify too (scripts/falsify-base.ts).
      - name: pnpm test:falsify:base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm test:falsify:base --base "origin/$BASE_REF"
