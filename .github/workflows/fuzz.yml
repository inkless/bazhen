name: Fuzz

# Runs the cargo-fuzz targets in crates/*/fuzz (docs/standards/rust.md § Tests), one job per crate,
# side by side: nightly for long, building on the corpus earlier runs kept; on a pull request that
# changes the Rust, briefly, so a broken target or a decoder it breaks is seen before it merges.
# Which pull requests run it is the `paths` filter below, not a choice of crates: every crate runs.
# Nightly, it also runs the property tests on random seeds: everywhere else they run on fixed ones.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/fuzz.yml"
      - ".nvmrc"
      # capped.ts and what it imports.
      - "scripts/capped.ts"
      - "scripts/is-main.ts"
      - "packages/host-guard/src/**"

# A pull request's runs share a group, and a newer one cancels the one running. Every other run
# shares one group and waits its turn, so no two restore the same corpus and save beside each other,
# where `prune` would keep one run's finds and delete the other's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # libFuzzer's instrumentation needs nightly; these jobs alone use it, pinned to one date.
  NIGHTLY: nightly-2026-11-01
  CARGO_FUZZ: 0.13.2
  SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || '600' }}

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      # Every crate with a fuzz crate, so one added later runs without editing this file. `ls`
      # fails when none match, which fails the job instead of passing with nothing fuzzed.
      - name: List the crates with a fuzz crate
        id: list
        run: |
          set -euo pipefail
          crates=$(ls crates/*/fuzz/Cargo.toml | cut -d/ -f2 | jq -Rnc '[inputs]')
          echo "crates=$crates" | tee -a "$GITHUB_OUTPUT"

  targets:
    needs: crates
    name: fuzz ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # Nightly, each target runs for 10 minutes after the crate's build, so a crate of up to 5
    # targets fits; bazhen-daemon, with 6, doesn't yet.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.crates.outputs.crates) }}
    env:
      CRATE: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v7
      # scripts/capped.ts caps each target's memory and time, and needs only Node and the source it
      # imports.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ }}-${{ runner.os }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo "+$NIGHTLY" install --locked "cargo-fuzz@$CARGO_FUZZ"
      # The build, saved once per lockfile by a run off a pull request, so a pull request starts
      # from it and rebuilds only the workspace's own crates; a pull request's own save would be
      # seen by that pull request alone. Restored on an exact key only, so a build saved for an
      # older lockfile never carries its artifacts into the next. Keys separate the crate with
      # `.`, which a package name can't hold, so one crate's key is never a prefix of another's.
      - uses: actions/cache/restore@v6
        id: target
        with:
          path: crates/${{ matrix.crate }}/fuzz/target
          key: fuzz-target.${{ matrix.crate }}.${{ env.NIGHTLY }}.cargo-fuzz-${{ env.CARGO_FUZZ }}.${{ hashFiles(format('crates/{0}/fuzz/Cargo.lock', matrix.crate)) }}
      # Each run starts from the corpus the last one left, so the nightly runs add up. A pull
      # request restores it but saves none: a pull request's save would be seen by that pull
      # request alone, and each of its runs made one, so they filled the repository's caches.
      - uses: actions/cache/restore@v6
        id: corpus
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus
          key: fuzz-corpus.${{ matrix.crate }}.${{ github.run_id }}
          restore-keys: fuzz-corpus.${{ matrix.crate }}.
      # Every target built before any runs, so the build is saved below even when the runs
      # outlast the job: nightly, a crate of 6 targets at 10 minutes each does.
      - name: Build the crate's targets
        id: build
        run: |
          set -euo pipefail
          cd "$CRATE"
          # Listed first, so a crate whose targets can't be listed fails the job.
          targets=$(cargo "+$NIGHTLY" fuzz list)
          if [ -z "$targets" ]; then
            echo "$CRATE/fuzz has no targets" >&2
            exit 1
          fi
          node ../../scripts/capped.ts --memory 4G --time 15m -- cargo "+$NIGHTLY" fuzz build
      # Saved on main once it built, on a miss: the build is good whatever the runs find. Not by a
      # pull request, whose save only it could read, nor by a run on another branch.
      - if: >-
          !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.target.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/target
          key: ${{ steps.target.outputs.cache-primary-key }}
      - name: Run the crate's targets
        id: run
        run: |
          set -euo pipefail
          cd "$CRATE"
          targets=$(cargo "+$NIGHTLY" fuzz list)
          for target in $targets; do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target" "fuzz/seeds/$target"
            # A target whose input can be longer than libFuzzer's guess names its own longest.
            max_len=()
            if [ -f "fuzz/max_len/$target" ]; then
              max_len=("-max_len=$(cat "fuzz/max_len/$target")")
            fi
            # libFuzzer's own limits are given, not left to its defaults, inside a cap of the run's.
            node ../../scripts/capped.ts --memory 4G \
              --time "$((SECONDS_PER_TARGET / 60 + 5))m" -- \
              cargo "+$NIGHTLY" fuzz run "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 "${max_len[@]}"
            echo "::endgroup::"
          done
      # Saved on main, off a pull request, when every target ran clean, as actions/cache saved it
      # before. The run's id keys it, so each run saves one, and `prune` below removes those before.
      - if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
          steps.run.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/

  # Each crate's newest corpus on main is the one a run restores, and it holds what the ones
  # before it did, since each run starts from the last. So once the crates' jobs are done, this
  # deletes the older ones, which nothing reads; a crate whose save failed keeps its newest, an
  # older run's. It alone may write the Actions caches, and only off a pull request, on main. It
  # prunes the crates that have a fuzz crate now: a removed one's corpora stay until deleted by hand.
  prune:
    needs: [crates, targets]
    if: >-
      !cancelled() && needs.crates.result == 'success' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete each crate's corpora but its newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRATES: ${{ needs.crates.outputs.crates }}
        run: |
          set -euo pipefail
          failed=0
          for crate in $(jq -r '.[]' <<< "$CRATES"); do
            # Keys separate the crate with `.`, so one crate's prefix never matches another's.
            ids=$(gh cache list --ref refs/heads/main --key "fuzz-corpus.$crate." \
              --sort created_at --order desc --limit 1000 --json id --jq '.[1:][].id')
            echo "$crate: deleting $(grep -c . <<< "$ids" || true) older corpora"
            for id in $ids; do
              # One already gone, evicted or deleted by hand, is done. Any other failure is kept
              # for the end, so it doesn't stop the crates after it being pruned.
              if ! out=$(gh api --method DELETE "repos/$GH_REPO/actions/caches/$id" 2>&1); then
                case $out in
                  *"HTTP 404"*) echo "$crate: cache $id was already gone" ;;
                  *) echo "::error::$crate: couldn't delete cache $id: $out"; failed=1 ;;
                esac
              fi
            done
          done
          exit "$failed"

  # The one check that stands for every crate's job, so its name stays the same as crates come and
  # go. It runs even when they failed, since a job skipped for a failure before it reads as a pass.
  fuzz:
    needs: [crates, targets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every crate's targets passed
        env:
          CRATES: ${{ needs.crates.result }}
          TARGETS: ${{ needs.targets.result }}
        run: |
          echo "crates: $CRATES; targets: $TARGETS"
          [ "$CRATES" = success ] && [ "$TARGETS" = success ]

  # A pull request runs every property test on one fixed seed (`cargo xtask gate` and
  # tests/support/fast-check-seed.ts), so it fails only for what it changed. This job draws new
  # cases: round after round, each on random seeds it prints, while a whole round still fits.
  properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # This job never commits, so it installs no git hooks.
      HUSKY: 0
      STEP_MINUTES: 105
      # The most a round can take: test-rust's 30-minute cap, test's 10, and a margin. No round
      # starts with less than this left, so none is cut off.
      ROUND_MINUTES: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152
      - run: pnpm install --frozen-lockfile
      - name: Run the property tests on random seeds
        timeout-minutes: 105
        run: |
          set -euo pipefail
          round=0
          while [ $((STEP_MINUTES * 60 - SECONDS)) -ge $((ROUND_MINUTES * 60)) ]; do
            round=$((round + 1))
            proptest_seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            fc_seed=$(od -An -N4 -td4 /dev/urandom | tr -d ' ')
            # Noted before the round runs, so that a run cancelled mid-round still names it.
            echo "- Round $round at $GITHUB_SHA: PROPTEST_RNG_SEED=$proptest_seed FC_SEED=$fc_seed" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Round $round: PROPTEST_RNG_SEED=$proptest_seed FC_SEED=$fc_seed"
            replay=""
            if ! PROPTEST_RNG_SEED="$proptest_seed" make test-rust; then
              replay="PROPTEST_RNG_SEED=$proptest_seed make test-rust"
            elif ! FC_SEED="$fc_seed" make test; then
              replay="FC_SEED=$fc_seed make test"
            fi
            echo "::endgroup::"
            if [ -n "$replay" ]; then
              message="Round $round failed at $GITHUB_SHA. Replay it there with: $replay"
              echo "::error::$message"
              printf '\n**%s**\n' "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "$round rounds passed." >> "$GITHUB_STEP_SUMMARY"
      # A failed proptest writes its shrunk case's seed here; committed with the fix, every run
      # after replays it.
      - name: Keep what failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore
