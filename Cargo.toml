[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Every third-party crate is pinned here, exactly, and members take it with `{ workspace = true }`
# (docs/standards/rust.md § Dependencies).
[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
bazhen-client = { path = "crates/bazhen-client" }
bazhen-holder = { path = "crates/bazhen-holder" }
bazhen-holder-engine = { path = "crates/bazhen-holder-engine" }
bazhen-holder-proto = { path = "crates/bazhen-holder-proto" }
bazhen-pid = { path = "crates/bazhen-pid" }
bazhen-protocol = { path = "crates/bazhen-protocol" }
bazhen-test-signal = { path = "crates/bazhen-test-signal" }
clap = { version = "=4.6.7", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
] }
jiff = { version = "=0.2.24", default-features = false, features = [
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }
libc = { version = "=0.2.191", default-features = false, features = ["std"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.6", default-features = false, features = [
  "std",
  "event",
  "fs",
  "net",
  "param",
  "process",
  "pty",
  "stdio",
  "termios",
] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
signal-hook = { version = "=0.4.6", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
unicode-width = { version = "=0.2.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
missing_debug_implementations = "forbid"
unreachable_pub = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Fires on nearly every pure function. `#[must_use]` goes where ignoring the value is a bug.
must_use_candidate = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
unreachable = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The holder's build: a panic in its terminal engine is caught and the engine replaced, which
# needs it to unwind. Everything else keeps `release`, which aborts.
[profile.release-holder]
inherits = "release"
panic = "unwind"
