name: Fuzz

# Runs every cargo-fuzz target in crates/*/fuzz (docs/standards/rust.md § Tests): nightly for long,
# building on the corpus earlier runs kept, and briefly on a pull request that changes the Rust, so
# a broken target or a decoder it breaks is seen before it merges. Nightly, it also runs the
# property tests on random seeds: everywhere else they run on fixed ones.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # libFuzzer's instrumentation needs nightly; this job alone uses it, pinned to one date.
  NIGHTLY: nightly-2026-11-01
  SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || '600' }}
  # What a target's build takes inside its time cap: the slowest one measured on CI took 37 s.
  BUILD_MINUTES: 2

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # scripts/capped.ts caps each target's memory and time, and needs only Node's built-ins.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Install nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo "+$NIGHTLY" install --locked cargo-fuzz@0.13.2
      # Each run starts from the corpus the last one left, so the nightly runs add up.
      - uses: actions/cache@v4
        with:
          path: crates/*/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run every target
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in crates/*/fuzz/Cargo.toml; do
            crate=$(dirname "$(dirname "$manifest")")
            # Listed first, so a crate whose targets can't be listed fails the job.
            targets=$(cd "$crate" && cargo "+$NIGHTLY" fuzz list)
            if [ -z "$targets" ]; then
              echo "$crate/fuzz has no targets" >&2
              exit 1
            fi
            for target in $targets; do
              echo "::group::$crate $target"
              mkdir -p "$crate/fuzz/corpus/$target" "$crate/fuzz/seeds/$target"
              # libFuzzer's own limits are given, not left to its defaults, inside a cap of the run's.
              (cd "$crate" && node ../../scripts/capped.ts --memory 4G \
                --time "$((SECONDS_PER_TARGET / 60 + BUILD_MINUTES + 5))m" -- \
                cargo "+$NIGHTLY" fuzz run "$target" \
                "fuzz/corpus/$target" "fuzz/seeds/$target" \
                -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048)
              echo "::endgroup::"
            done
          done
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/

  # A pull request runs every property test on one fixed seed (scripts/cargo-gate.ts and
  # tests/support/fast-check-seed.ts), so it fails only for what it changed. This job draws new
  # cases: round after round, each on random seeds it prints, until its time is up.
  properties:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROUNDS_MINUTES: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.152
      - run: pnpm install --frozen-lockfile
      - name: Run the property tests on random seeds
        run: |
          set -euo pipefail
          end=$((SECONDS + ROUNDS_MINUTES * 60))
          round=0
          while [ "$SECONDS" -lt "$end" ]; do
            round=$((round + 1))
            proptest_seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            fc_seed=$(od -An -N4 -ti4 /dev/urandom | tr -d ' ')
            seeds="PROPTEST_RNG_SEED=$proptest_seed FC_SEED=$fc_seed"
            echo "::group::Round $round: $seeds"
            if ! PROPTEST_RNG_SEED="$proptest_seed" pnpm test:rust \
              || ! FC_SEED="$fc_seed" pnpm test; then
              echo "::endgroup::"
              echo "::error::Round $round failed. Replay it with $seeds pnpm test:rust or pnpm test."
              exit 1
            fi
            echo "::endgroup::"
          done
      # A failed proptest writes its shrunk case's seed here; committed with the fix, every run
      # after replays it.
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/
          if-no-files-found: ignore
