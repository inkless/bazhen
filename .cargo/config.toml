# cargo test, nextest and cargo-mutants start every test binary through this runner, which gives
# each test process a memory and time cap of its own (docs/standards/testing.md § Memory and time
# caps). Pinned as CARGO_CONFIG in scripts/check-standards.ts.
[target.'cfg(all())']
runner = ["scripts/capped.ts", "--test-binary", "--"]

# cargo starts `cargo run` through the runner too, which would cap xtask as one test process and
# every command it starts with it. A `--config` runner replaces the array; `[]` and `""` are refused.
# xtask runs the Rust gates, so it is built with no rustc wrapper or compiler a cargo config
# names, as the gates build: one could stand in for xtask itself. RUSTC_WRAPPER in the caller's
# environment still outranks `--config`; the gates' own commands run without it. A runner set for
# the host's triple outranks this one, so the gate scripts run scripts/xtask.sh, which builds xtask
# with the same overrides and runs it with no runner at all.
[alias]
xtask = [
  "run",
  "--quiet",
  "--locked",
  "--package",
  "bazhen-xtask",
  "--config",
  "target.'cfg(all())'.runner=['env']",
  "--config",
  "build.rustc-wrapper=''",
  "--config",
  "build.rustc-workspace-wrapper=''",
  "--config",
  "build.rustc='rustc'",
  "--",
]
